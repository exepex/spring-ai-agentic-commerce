server:
  port: 8084

spring:
  application:
    name: shipping-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: commerce
    password: commerce
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: shipping
  flyway:
    default-schema: shipping
    schemas: shipping
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # The event is a JSON contract between services, not a Java type: leave class names out of the headers.
        spring.json.add.type.headers: false
    consumer:
      group-id: shipping-service
      auto-offset-reset: earliest
      # An event that is not valid JSON goes to the dead-letter topic with its bytes instead of failing forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: io.github.exepex.commerce.shipping.OrderEvent
        spring.json.use.type.headers: false
  mvc:
    problemdetails:
      enabled: true

commerce:
  topics:
    order-events: order.events
    shipment-events: shipment.events

