# Serves the Angular app and routes /svc/<service>/ to each backend, so the browser talks to one origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Agent-only endpoints are not reachable from the browser.
    location /svc/governance/mcp { return 404; }
    location /svc/governance/api/agent/ { return 404; }
    # Health probes and metrics are for the platform, not the browser.
    location ~ ^/svc/[^/]+/actuator { return 404; }

    location /svc/catalog/ { proxy_pass http://catalog-service:8081/; }
    location /svc/orders/ { proxy_pass http://order-service:8082/; }
    location /svc/payments/ { proxy_pass http://payment-service:8083/; }
    location /svc/shipping/ { proxy_pass http://shipping-service:8084/; }
    location /svc/governance/ { proxy_pass http://commerce-mcp-server:8085/; }
    location /svc/agents/ {
        proxy_pass http://agent-service:8086/;
        # A chat turn waits for the model and its tool calls.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
