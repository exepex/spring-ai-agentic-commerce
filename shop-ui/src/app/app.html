<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" routerLink="/shop">
      <span class="logo" aria-hidden="true">▲</span>
      Trailhead
      <span class="tag">governed AI agents demo</span>
    </a>
    <nav>
      <a routerLink="/shop" routerLinkActive="active">Shop</a>
      <a routerLink="/orders" routerLinkActive="active">Orders</a>
      <a routerLink="/operations" routerLinkActive="active">Operations</a>
    </nav>
    <label class="persona">
      <span class="muted small">Signed in as</span>
      <select [ngModel]="session.customer()" (ngModelChange)="session.switchTo($event)" aria-label="Customer">
        @for (customer of customers; track customer) {
          <option [value]="customer">{{ customer }}</option>
        }
      </select>
    </label>
  </div>
</header>
<router-outlet />
