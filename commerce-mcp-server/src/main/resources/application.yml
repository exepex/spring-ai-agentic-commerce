server:
  port: 8085

spring:
  application:
    name: commerce-mcp-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: commerce
    password: commerce
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: governance
  flyway:
    default-schema: governance
    schemas: governance
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: commerce-mcp-server
      auto-offset-reset: earliest
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s
    serviceclient:
      catalog:
        base-url: http://localhost:8081
      order:
        base-url: http://localhost:8082
      payment:
        base-url: http://localhost:8083
      shipping:
        base-url: http://localhost:8084
  ai:
    mcp:
      server:
        name: commerce
        version: 1.0.0
        protocol: streamable
        instructions: >
          Tools for an online shop: look up products, orders, payments and shipments; propose orders for a customer
          to confirm; cancel orders; refund payments within a limit; notify customers; escalate to a human.
  mvc:
    problemdetails:
      enabled: true

commerce:
  # How often confirmations that did not finish are settled. A confirmation counts as stalled once it is older than
  # settle-after, so one still running is left alone.
  reconciliation:
    interval: 15s
    settle-after: 30s
  topics:
    order-events: order.events
    payment-events: payment.events
    shipment-events: shipment.events
    stock-out: inventory.stock-out
  cases:
    # The agent that works cases. The ServiceNow MCP server's poller syncs cases with ServiceNow on its behalf, with
    # its token; no other agent may.
    worker: incident-agent
  governance:
    # Refunds up to this amount run straight away; larger ones wait for a human to approve them.
    refund-approval-threshold: 100.00
    # Each agent authenticates with its own bearer token. Which tools it may call comes from its definition in
    # agent-definitions/src/main/resources/agents.
    agents:
      shopping-assistant:
        token: ${AGENTIC_COMMERCE_SHOPPING_ASSISTANT_TOKEN:dev-shopping-assistant-token}
      incident-agent:
        token: ${AGENTIC_COMMERCE_INCIDENT_AGENT_TOKEN:dev-incident-agent-token}

management:
  otlp:
    metrics:
      export:
        # Jaeger only takes traces; without this every service fails to push metrics to it once a minute.
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
