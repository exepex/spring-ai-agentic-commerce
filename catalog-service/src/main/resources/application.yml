server:
  port: 8081

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: commerce
    password: ${AGENTIC_COMMERCE_DATABASE_PASSWORD:commerce}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: catalog
  flyway:
    default-schema: catalog
    schemas: catalog
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # The event is a JSON contract between services, not a Java type: leave class names out of the headers.
        spring.json.add.type.headers: false
  mvc:
    problemdetails:
      enabled: true

commerce:
  # Only other services may reserve, release and hand over stock; they present the service token.
  internal-api:
    protected-endpoints:
      - POST /api/products/{productId}/reservations
      - DELETE /api/orders/{orderId}/reservations
      - POST /api/orders/{orderId}/dispatch
  topics:
    stock-out: inventory.stock-out

