# Infrastructure for running the services locally. The services themselves run with `mvn spring-boot:run`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Single-node KRaft broker; the image's default configuration advertises localhost:9092.
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"

  jaeger:
    # Collects OpenTelemetry traces (OTLP on 4318) and shows them at http://localhost:16686.
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"
      - "4318:4318"
