# Every service sends its traces to Jaeger, all of them, so an order's timeline links to each step.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Jaeger only takes traces; without this every service fails to push metrics to it once a minute.
management.otlp.metrics.export.enabled=false
# Each service keeps the events it has not yet put on Kafka in an outbox table of its own schema.
commerce.events.outbox.table=${spring.flyway.default-schema:public}.outbox_event
# Kafka keeps an event once every replica has it; small batches, compressed, raise throughput at a few ms of latency.
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.linger.ms=5
# The token services present to each other's internal endpoints (placing, charging, reserving, refunding).
commerce.internal-api.token=${AGENTIC_COMMERCE_INTERNAL_API_TOKEN:dev-internal-api-token}
# Each listener runs up to three consumers; events of one order or product share a partition, so they stay in order.
spring.kafka.listener.concurrency=3
