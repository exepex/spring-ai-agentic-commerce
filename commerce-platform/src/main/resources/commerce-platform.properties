# Every service sends its traces to Jaeger, all of them, so an order's timeline links to each step.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# Jaeger only takes traces; without this every service fails to push metrics to it once a minute.
management.otlp.metrics.export.enabled=false
# Each service keeps the events it has not yet put on Kafka in an outbox table of its own schema.
commerce.events.outbox.table=${spring.flyway.default-schema:public}.outbox_event
# Kafka keeps an event once every replica has it; small batches, compressed, raise throughput at a few ms of latency.
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.linger.ms=5
# The token services present to each other's internal endpoints (placing, charging, reserving, refunding).
commerce.internal-api.token=${AGENTIC_COMMERCE_INTERNAL_API_TOKEN:dev-internal-api-token}
# Each listener runs up to three consumers; events of one order or product share a partition, so they stay in order.
spring.kafka.listener.concurrency=3
# Probes for an orchestrator (/actuator/health/liveness and /readiness) and metrics for Prometheus; nothing else.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# A stopping service finishes the requests it has, and stops taking new ones.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# A request waits at most five seconds for a database connection, instead of queueing for thirty.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
# A scheduled job marked @SchedulerLock runs on one instance at a time; a lock outlives a dead instance by at most this.
# It is well above the longest bounded run (a batch of 50 calls that each wait for their timeout), so a second
# instance never takes the lock from a run that is still working.
commerce.scheduling.lock-table=${spring.flyway.default-schema:public}.shedlock
commerce.scheduling.lock-at-most-for=30m
# Collections are loaded for many entities in one query instead of one query each, and writes are sent in batches.
spring.jpa.properties.hibernate.default_batch_fetch_size=64
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Flyway locks with a session-level advisory lock rather than one held in an open transaction, so a migration that
# builds an index CONCURRENTLY does not wait for Flyway's own transaction forever.
spring.flyway.postgresql.transactional-lock=false
