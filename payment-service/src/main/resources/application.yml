server:
  port: 8083

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: commerce
    password: ${AGENTIC_COMMERCE_DATABASE_PASSWORD:commerce}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: payments
  flyway:
    default-schema: payments
    schemas: payments
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # The event is a JSON contract between services, not a Java type: leave class names out of the headers.
        spring.json.add.type.headers: false
  mvc:
    problemdetails:
      enabled: true

commerce:
  # Only other services may charge and refund: a refund through the shop's MCP server is held to the approval limit.
  internal-api:
    protected-endpoints:
      - POST /api/payments
      - POST /api/payments/{orderId}/refunds
  topics:
    payment-events: payment.events
  payments:
    # Leave empty to use the built-in simulated gateway; set a Stripe test-mode key (sk_test_...) to use Stripe.
    stripe-secret-key: ${AGENTIC_COMMERCE_STRIPE_SECRET_KEY:}
    # How often refunds are checked with the card processor: pending ones until they settle, and succeeded ones for
    # the watch period after they succeeded, since a succeeded refund can still fail.
    refund-check:
      interval: 1m
      watch: 1h

