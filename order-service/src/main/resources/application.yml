server:
  port: 8082

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: commerce
    password: commerce
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: orders
  flyway:
    default-schema: orders
    schemas: orders
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
    serviceclient:
      catalog:
        base-url: http://localhost:8081
      payment:
        base-url: http://localhost:8083
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # The event is a JSON contract between services, not a Java type: leave class names out of the headers.
        spring.json.add.type.headers: false
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: io.github.exepex.commerce.order.ShipmentEvent
        spring.json.use.type.headers: false
  mvc:
    problemdetails:
      enabled: true

commerce:
  # Orders are placed and cancelled only by the shop's MCP server: a confirmed proposal or an agent's cancellation.
  # Checkout calls the catalog and payments with the service token.
  internal-api:
    protected-endpoints:
      - POST /api/orders
      - POST /api/orders/{orderId}/cancellation
    clients: catalog, payment
  # How often checkout's unfinished work is retried: payments whose outcome is unknown and unconfirmed stock releases.
  # An order counts as stalled once it is older than settle-after, so a checkout still running is left alone.
  reconciliation:
    interval: 15s
    settle-after: 30s
  topics:
    order-events: order.events
    shipment-events: shipment.events

