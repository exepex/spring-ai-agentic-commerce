server:
  port: 8086

spring:
  application:
    name: agent-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: agent-service
      # A stock-out published before this service first joined its group is still handled. A replayed one does not
      # act twice: the agent checks which steps are already done and does only the others.
      auto-offset-reset: earliest
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 30s
    serviceclient:
      governance:
        base-url: http://localhost:8085
  ai:
    anthropic:
      api-key: ${AGENTIC_COMMERCE_ANTHROPIC_API_KEY:}
      # Set explicitly: the Anthropic SDK otherwise falls back to an ANTHROPIC_BASE_URL environment variable, which
      # some machines set for other tools. The key must only ever go to Anthropic.
      base-url: https://api.anthropic.com
      timeout: 120s

commerce:
  topics:
    stock-out: inventory.stock-out
  # Where the agents connect and with which tokens. What each agent is (model, effort, tools, budget, prompt) is in
  # its definition in agent-definitions/src/main/resources/agents.
  agents:
    mcp-url: http://localhost:8085
    shopping-assistant:
      token: ${AGENTIC_COMMERCE_SHOPPING_ASSISTANT_TOKEN:dev-shopping-assistant-token}
    order-exceptions-agent:
      token: ${AGENTIC_COMMERCE_ORDER_EXCEPTIONS_AGENT_TOKEN:dev-order-exceptions-agent-token}
  slack:
    # The Slack MCP server and the one channel agents may post in. Leave the URL empty to run without Slack.
    mcp-url: ${AGENTIC_COMMERCE_SLACK_MCP_URL:}
    api-key: ${AGENTIC_COMMERCE_SLACK_MCP_API_KEY:dev-slack-mcp-key}
    channel-id: ${AGENTIC_COMMERCE_SLACK_CHANNEL_ID:}

management:
  otlp:
    metrics:
      export:
        # Jaeger only takes traces; without this every service fails to push metrics to it once a minute.
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
