server:
  port: 8086

spring:
  application:
    name: agent-service
  # A chat turn waits for the model; a stopping service lets the turns it has finish.
  lifecycle:
    timeout-per-shutdown-phase: 3m
  threads:
    virtual:
      enabled: true
  # The shopping assistant's conversations live in this service's own schema.
  datasource:
    url: jdbc:postgresql://localhost:5432/commerce
    username: commerce
    password: ${AGENTIC_COMMERCE_DATABASE_PASSWORD:commerce}
    hikari:
      # Spring AI's chat memory names its table without a schema.
      schema: agents
  flyway:
    default-schema: agents
    schemas: agents
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: agent-service
      # An incident claimed before this service first joined its group is still worked.
      auto-offset-reset: earliest
      # One incident per poll. Kafka gives an incident to another consumer only after 20 minutes, while an incident
      # run may act for 15 (commerce.agents.incident-run-limit): two runs never both act on one incident.
      max-poll-records: 1
      properties:
        max.poll.interval.ms: 1200000
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 30s
    serviceclient:
      governance:
        base-url: http://localhost:8085
  ai:
    chat:
      memory:
        repository:
          jdbc:
            # The table comes from this service's own Flyway migration.
            initialize-schema: never
    anthropic:
      api-key: ${AGENTIC_COMMERCE_ANTHROPIC_API_KEY:}
      # Set explicitly: the Anthropic SDK otherwise falls back to an ANTHROPIC_BASE_URL environment variable, which
      # some machines set for other tools. The key must only ever go to Anthropic.
      base-url: https://api.anthropic.com
      timeout: 120s

commerce:
  topics:
    incidents: servicenow.incidents
  # Where the agents connect and with which tokens. What each agent is (model, effort, tools, budget, prompt) is in
  # its definition in agent-definitions/src/main/resources/agents.
  agents:
    mcp-url: http://localhost:8085
    shopping-assistant:
      token: ${AGENTIC_COMMERCE_SHOPPING_ASSISTANT_TOKEN:dev-shopping-assistant-token}
    incident-agent:
      token: ${AGENTIC_COMMERCE_INCIDENT_AGENT_TOKEN:dev-incident-agent-token}
    # After this, every tool call of an incident run is refused and the unfinished incident goes to a team. Keep it
    # well below spring.kafka.consumer max.poll.interval.ms (20 minutes).
    incident-run-limit: 15m
    # A conversation nobody has written to for this long is forgotten.
    conversation-idle-limit: 1d
  slack:
    # The Slack MCP server and the one channel agents may post in. Leave the URL empty to run without Slack.
    mcp-url: ${AGENTIC_COMMERCE_SLACK_MCP_URL:}
    api-key: ${AGENTIC_COMMERCE_SLACK_MCP_API_KEY:dev-slack-mcp-key}
    channel-id: ${AGENTIC_COMMERCE_SLACK_CHANNEL_ID:}
  servicenow:
    # The ServiceNow MCP server, which feeds incidents to the incident agent. Leave it empty to run without ServiceNow.
    mcp-url: ${AGENTIC_COMMERCE_SERVICENOW_MCP_URL:}
